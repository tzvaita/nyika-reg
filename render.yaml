# Render blueprint for the Nyika registry POC.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# Two values are deliberately NOT stored here and must be set in the Render
# dashboard after the first deploy (both are marked sync: false):
#
#   RAILS_MASTER_KEY  contents of config/master.key (gitignored, never committed)
#   SEED_PASSWORD     password for the seeded demo users. MUST be set: this
#                     repository is public, so the default in db/seeds.rb is
#                     readable by anyone.
#
# The database is created and seeded automatically on first boot:
# bin/docker-entrypoint runs `rails db:prepare`, which loads the schema and runs
# db/seeds.rb when the database is new. Later deploys only run pending migrations.

# No region is declared anywhere in this file, deliberately. Both resources take
# Render's default region and therefore always match. Render's internal hostname
# (dpg-...-a) only resolves within a single region; a mismatch fails at boot with
#   PG::ConnectionBad: could not translate host name "dpg-..." to address
# If you ever pin a region, you must pin it on BOTH the database and the service.
databases:
  - name: nyika-registry-db
    databaseName: nyika_registry
    user: nyika
    plan: free

services:
  - type: web
    name: nyika-registry
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nyika-registry-db
          property: connectionString

      # Set in the dashboard — never committed.
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SEED_PASSWORD
        sync: false

      - key: RAILS_ENV
        value: production

      # Thruster (the Dockerfile's CMD) listens on HTTP_PORT; Render routes to PORT.
      # They must match.
      - key: HTTP_PORT
        value: 10000
      - key: PORT
        value: 10000

      # One Puma worker fits the free instance's memory.
      - key: WEB_CONCURRENCY
        value: 1

      # Log to stdout so entries show up in Render's log viewer.
      - key: RAILS_LOG_TO_STDOUT
        value: true
